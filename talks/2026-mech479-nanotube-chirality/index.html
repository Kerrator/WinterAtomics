<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon nanotube chirality</title>
<style>
:root{
  --ink:#1c2530; --muted:#5d6b7a; --line:#d5dbe3; --bg:#f4f5f7; --panel:#ffffff; --accent:#1f5fae;
  --metal:#1d9e75; --semi:#d85a30;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;height:100dvh;
}
header{padding:10px 18px 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:600}
header span{color:var(--muted);font-size:14px}
main{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  gap:12px;padding:0 18px;
}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;overflow:hidden}
.panel canvas,.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel canvas{touch-action:none;cursor:grab}
.panel svg{top:48px;height:calc(100% - 76px)}
.panel canvas.grabbing{cursor:grabbing}
.tag,.hint{position:absolute;left:12px;font-size:13px;color:var(--muted);pointer-events:none}
.tag{top:9px;font-weight:600}
.tag small{display:block;font-size:inherit;font-weight:400}
.hint{bottom:9px;right:12px}
.bar{padding:10px 18px 0;display:flex;gap:14px 22px;align-items:center;flex-wrap:wrap}
.bar.last{padding-bottom:12px}
button{
  font:inherit;color:var(--ink);background:#fff;border:1px solid #b9c2cd;border-radius:7px;
  padding:6px 12px;cursor:pointer;
}
button:hover{background:#eef2f6}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"],button[aria-pressed="true"]:hover{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.grp{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{color:var(--muted)}
.slide{flex:1 1 220px;max-width:340px;flex-wrap:nowrap}
input[type=range]{flex:1;min-width:110px;margin:0;accent-color:var(--accent);cursor:pointer}
.slide output{min-width:1.6em;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.readout{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:baseline}
.readout div{white-space:nowrap}
.readout span{color:var(--muted);font-size:14px;margin-right:6px}
.readout b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
#elec.metal{color:var(--metal)}
#elec.semi{color:var(--semi)}
.note{flex:1 1 320px;min-height:2.7em;font-size:15px;line-height:1.35;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
@media (max-width:820px){
  html,body{height:auto}
  body{height:auto}
  main{grid-template-columns:1fr;padding:0 10px}
  #p3{aspect-ratio:1/0.62}
  #p2{aspect-ratio:680/530}
  .panel svg{height:calc(100% - 52px)}
  .bar{padding:10px 10px 0}
  .slide{max-width:none}
  .hint{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Carbon nanotube chirality</h1>
  <span>MECH 479 · Carbon nanostructures</span>
</header>
<main>
  <div class="panel" id="p3">
    <canvas id="tube" aria-label="The rolled nanotube, drawn in 3D; drag to rotate"></canvas>
    <div class="tag">The rolled tube<small id="tubeTag">(10, 10)</small></div>
    <div class="hint">Drag to rotate</div>
  </div>
  <div class="panel" id="p2">
    <svg id="map" viewBox="0 0 680 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mapTitle mapDesc">
      <title id="mapTitle">Chirality map</title>
      <desc id="mapDesc">Graphene lattice points (n, m) between the zigzag and armchair directions; filled dots are metallic tubes, rings are semiconducting. The arrow is the roll-up vector of the chosen tube.</desc>
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g id="mapg"></g>
    </svg>
    <div class="tag">The graphene sheet<small>Each dot is a tube; the arrow is how the sheet is rolled</small></div>
    <div class="hint">Click a dot to choose a tube</div>
  </div>
</main>
<section class="bar">
  <div class="grp slide"><label class="lbl" for="n">n</label><input type="range" id="n" min="3" max="17" step="1" value="10"><output id="nv" for="n">10</output></div>
  <div class="grp slide"><label class="lbl" for="m">m</label><input type="range" id="m" min="0" max="10" step="1" value="10"><output id="mv" for="m">10</output></div>
  <div class="grp" id="presets" role="group" aria-label="Example tubes"><span class="lbl">Examples</span></div>
</section>
<section class="bar last">
  <div class="readout" aria-live="polite">
    <div><span>Type</span><b id="kind">Armchair</b></div>
    <div><span>Diameter</span><b id="diam">1.36 nm</b></div>
    <div><span>Chiral angle</span><b id="ang">30.0°</b></div>
    <div><span>Electronic</span><b id="elec" class="metal">Metallic</b></div>
  </div>
  <div class="note" id="note"></div>
</section>
<script>
"use strict";
// Geometry: graphene lattice vectors a1 = a(1, 0), a2 = a(1/2, √3/2), a = 0.246 nm; atoms at 0 and (a1 + a2)/3.
// Tube (n, m): roll-up vector C = n a1 + m a2, |C| = a√(n² + nm + m²), d = |C|/π, chiral angle θ = atan(√3 m / (2n + m)).
// Metallic when (n − m) mod 3 = 0 (only armchair exactly; the others have a tiny curvature gap); otherwise E_g ≈ 0.8 eV·nm / d.
const A = 0.246, S3 = Math.sqrt(3), L = 4.5, NMAX = 17;
const METAL = "#1d9e75", SEMI = "#d85a30", ACCENT = "#1f5fae", MUTED = "#5d6b7a", LINE = "#b9c2cd", BOND = "#3a4654";
const PRESETS = [[10, 10, "Armchair (10,10)"], [9, 0, "Zigzag (9,0)"], [10, 0, "Zigzag (10,0)"], [17, 0, "Zigzag (17,0)"], [10, 5, "Chiral (10,5)"], [9, 6, "Chiral (9,6)"]];
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let n = 10, m = 10, spin = 0.3, geo = null, dragging = false, px = 0, py = 0;

function info(n, m) {
  const C = A * Math.sqrt(n * n + n * m + m * m), d = C / Math.PI;
  const theta = Math.atan2(S3 * m, 2 * n + m) * 180 / Math.PI;
  const diff = n - m, metal = diff % 3 === 0;
  const kind = m === 0 ? "Zigzag" : m === n ? "Armchair" : "Chiral";
  const elec = m === n ? "Metallic" : metal ? "Quasi-metallic" : "Semiconducting, " + (0.8 / d).toFixed(2) + " eV";
  return { C, d, theta, diff, metal, kind, elec };
}

function build() {
  const C = A * Math.sqrt(n * n + n * m + m * m);
  const cx = (n + m / 2) * A / C, cy = (m * S3 / 2) * A / C;   // unit vector along C (around the tube)
  const tx = -cy, ty = cx;                                     // unit vector along the tube axis
  const uv = (x, y) => [x * cx + y * cy, x * tx + y * ty];
  const wrap = u => ((u % C) + C) % C;
  const d1 = [A / 2, A * S3 / 6];
  const deltas = [d1, [d1[0] - A, d1[1]], [0, d1[1] - A * S3 / 2]].map(d => uv(d[0], d[1]));
  const K = Math.ceil((C + L) / A * 1.3) + 2, atoms = [], bonds = [];
  for (let i = -K; i <= K; i++) for (let j = -K; j <= K; j++) {
    const x = (i + j / 2) * A, y = j * S3 / 2 * A;
    const [u, v] = uv(x, y);
    if (u >= 0 && u < C && v >= 0 && v < L) {
      atoms.push([u, v]);
      for (const [du, dv] of deltas) { const v2 = v + dv; if (v2 >= 0 && v2 < L) bonds.push([u, v, wrap(u + du), v2]); }
    }
    const [ub, vb] = uv(x + d1[0], y + d1[1]);
    if (ub >= 0 && ub < C && vb >= 0 && vb < L) atoms.push([ub, vb]);
  }
  geo = { atoms, bonds, C, R: C / (2 * Math.PI) };
}

const cv = $("tube"), ctx = cv.getContext("2d");
function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const { atoms, bonds, C, R } = geo;
  const s = Math.min((W - 48) / L, (H - 96) / (2 * R)), ox = W / 2, oy = H / 2 + 6;
  const P = (u, v) => { const f = 2 * Math.PI * u / C + spin; return [ox + (v - L / 2) * s, oy + R * Math.cos(f) * s, Math.sin(f)]; };
  const prims = [];
  for (const b of bonds) { const p = P(b[0], b[1]), q = P(b[2], b[3]); prims.push([0, (p[2] + q[2]) / 2, p, q]); }
  for (const a of atoms) { const p = P(a[0], a[1]); prims.push([1, p[2], p]); }
  prims.sort((x, y) => x[1] - y[1]);
  const atomColor = info(n, m).metal ? METAL : SEMI, bw = Math.max(1, 0.013 * s), ar = Math.max(1.8, 0.03 * s);
  ctx.lineCap = "round";
  for (const p of prims) {
    ctx.globalAlpha = 0.14 + 0.86 * (p[1] + 1) / 2;
    if (p[0] === 0) { ctx.strokeStyle = BOND; ctx.lineWidth = bw; ctx.beginPath(); ctx.moveTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]); ctx.stroke(); }
    else { ctx.fillStyle = atomColor; ctx.beginPath(); ctx.arc(p[2][0], p[2][1], ar, 0, 2 * Math.PI); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

const NS = "http://www.w3.org/2000/svg", K = 23, OX = 44, OY = 382;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || $("mapg")).appendChild(e);
  return e;
}
function text(x, y, s, anchor, size, fill, weight) {
  const t = el("text", { x, y, "text-anchor": anchor || "start", "font-size": size || 13, fill: fill || MUTED, "font-family": "Helvetica Neue, Helvetica, Arial, sans-serif" });
  if (weight) t.setAttribute("font-weight", weight);
  t.textContent = s;
  return t;
}
function drawMap() {
  $("mapg").replaceChildren();
  const pt = (i, j) => [OX + (i + j / 2) * K, OY - j * S3 / 2 * K];
  const [zx, zy] = pt(NMAX, 0), [ax, ay] = pt(NMAX, NMAX);
  el("line", { x1: OX, y1: OY, x2: zx + 10, y2: zy, stroke: LINE, "stroke-width": 1, "stroke-dasharray": "4 4" });
  el("line", { x1: OX, y1: OY, x2: ax + 8, y2: ay - 5, stroke: LINE, "stroke-width": 1, "stroke-dasharray": "4 4" });
  const [sx, sy] = pt(n, m);
  el("line", { x1: OX, y1: OY, x2: sx, y2: sy, stroke: ACCENT, "stroke-width": 2, "marker-end": "url(#arrow)" });
  for (let i = 3; i <= NMAX; i++) for (let j = 0; j <= i; j++) {
    const [x, y] = pt(i, j), metal = (i - j) % 3 === 0, chosen = i === n && j === m;
    const g = el("g", { tabindex: "-1" });
    el("circle", { cx: x, cy: y, r: 10, fill: "transparent" }, g);
    el("circle", { cx: x, cy: y, r: chosen ? 7 : 5, fill: metal ? METAL : "#fff", stroke: metal ? METAL : SEMI, "stroke-width": metal ? 1 : 1.8 }, g);
    if (chosen) el("circle", { cx: x, cy: y, r: 11, fill: "none", stroke: "#1c2530", "stroke-width": 1.4 }, g);
    const tt = el("title", {}, g); tt.textContent = "(" + i + ", " + j + ") " + (metal ? (i === j ? "metallic" : "quasi-metallic") : "semiconducting");
    g.style.cursor = "pointer";
    g.addEventListener("click", () => set(i, j));
  }
  el("circle", { cx: OX, cy: OY, r: 3, fill: MUTED });
  el("line", { x1: OX, y1: OY, x2: OX + K, y2: OY, stroke: "#1c2530", "stroke-width": 1.4, "marker-end": "url(#arrow)" });
  el("line", { x1: OX, y1: OY, x2: OX + K / 2, y2: OY - K * S3 / 2, stroke: "#1c2530", "stroke-width": 1.4, "marker-end": "url(#arrow)" });
  text(OX + K / 2, OY + 17, "a₁", "middle", 13, "#1c2530");
  text(OX - 4, OY - K * S3 / 2 - 4, "a₂", "end", 13, "#1c2530");
  text(OX + 8.5 * K + 20, OY + 34, "zigzag (n, 0): θ = 0°", "middle");
  text(452, 126, "armchair (n, n): θ = 30°", "end");
  el("circle", { cx: 52, cy: 110, r: 5, fill: METAL, stroke: METAL });
  text(64, 114, "metallic: n − m divisible by 3", "start", 13, "#1c2530");
  el("circle", { cx: 52, cy: 132, r: 5, fill: "#fff", stroke: SEMI, "stroke-width": 1.8 });
  text(64, 136, "semiconducting", "start", 13, "#1c2530");
  el("line", { x1: 44, y1: 156, x2: 60, y2: 156, stroke: ACCENT, "stroke-width": 2 });
  text(64, 160, "roll-up vector C = n a₁ + m a₂", "start", 13, "#1c2530");
}

function note(I) {
  const orient = I.kind === "Zigzag" ? "Some C–C bonds run along the tube axis."
    : I.kind === "Armchair" ? "Some C–C bonds run around the circumference."
    : "The hexagons spiral round the tube.";
  const rule = I.metal
    ? (m === n ? "n − m = 0, divisible by 3: <b>metallic</b>; every armchair tube is."
               : "n − m = " + I.diff + ", divisible by 3: <b>quasi-metallic</b>; curvature opens only a tiny gap (tens of meV at most).")
    : "n − m = " + I.diff + ", not divisible by 3: <b>semiconducting</b>, E<sub>g</sub> ≈ 0.8 eV·nm / " + I.d.toFixed(2) + " nm ≈ " + (0.8 / I.d).toFixed(2) + " eV.";
  return orient + " " + rule;
}

function set(nn, mm) {
  n = Math.max(3, Math.min(NMAX, nn)); m = Math.max(0, Math.min(n, mm));
  $("n").value = n; $("m").max = n; $("m").value = m; $("nv").textContent = n; $("mv").textContent = m;
  const I = info(n, m);
  $("kind").textContent = I.kind + " (" + n + ", " + m + ")";
  $("tubeTag").textContent = "(" + n + ", " + m + "), " + L + " nm shown";
  $("diam").textContent = I.d.toFixed(2) + " nm";
  $("ang").textContent = I.theta.toFixed(1) + "°";
  $("elec").textContent = I.elec;
  $("elec").className = I.metal ? "metal" : "semi";
  $("note").innerHTML = note(I);
  document.querySelectorAll("#presets button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n && +b.dataset.m === m)));
  build(); drawMap(); draw();
}

for (const [pn, pm, label] of PRESETS) {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.n = pn; b.dataset.m = pm; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => set(pn, pm));
  $("presets").appendChild(b);
}
$("n").addEventListener("input", e => set(+e.target.value, m));
$("m").addEventListener("input", e => set(n, +e.target.value));
cv.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); cv.classList.add("grabbing"); });
cv.addEventListener("pointermove", e => { if (!dragging) return; spin += ((e.clientY - py) + (e.clientX - px)) * 0.012; px = e.clientX; py = e.clientY; draw(); });
const stop = () => { dragging = false; cv.classList.remove("grabbing"); };
cv.addEventListener("pointerup", stop); cv.addEventListener("pointercancel", stop);
new ResizeObserver(draw).observe(cv);
function loop() { if (!dragging && !reduceMotion && !document.hidden) { spin += 0.005; draw(); } requestAnimationFrame(loop); }
set(10, 10);
requestAnimationFrame(loop);
</script>
</body>
</html>
